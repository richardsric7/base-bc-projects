name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

  # Deployment is intentionally left out of this base template: the
  # upstream project this was derived from pushes to a specific
  # DigitalOcean Container Registry and triggers a Portainer webhook, which
  # is infra specific to that deployment. Add a job here once you've picked
  # a registry/host, e.g.:
  #
  # deploy:
  #   needs: build-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: docker/setup-buildx-action@v3
  #     - uses: docker/login-action@v3
  #       with: { registry: ..., username: ..., password: ... }
  #     - uses: docker/build-push-action@v6
  #       with: { push: true, tags: ... }
