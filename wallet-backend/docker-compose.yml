services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_TYPE: postgres
      DB_CONNECTION_STRING: "host=postgres user=wallet password=wallet dbname=wallet_backend port=5432 sslmode=disable"
      DB_AUTOMIGRATE: "true"
      ENABLE_CACHING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STELLAR_NETWORK: testnet
    ports:
      - "8080:8080"

volumes:
  postgres-data:
